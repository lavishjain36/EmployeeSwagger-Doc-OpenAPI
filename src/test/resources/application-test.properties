# tiny fake database used only while tests run
spring.datasource.url=jdbc:h2:mem:employees
# how Java talks to that fake database
spring.datasource.driverClassName=org.h2.Driver
# login name for the fake database
spring.datasource.username=sa
# no password
spring.datasource.password=
# wipe and rebuild the table for each test run
spring.jpa.hibernate.ddl-auto=create-drop
# tell Hibernate we are using the fake database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
