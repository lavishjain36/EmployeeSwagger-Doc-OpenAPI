# name of this app
spring.application.name=employeeopenapidoc
# website port in the browser
server.port=8080

# machine-readable API list
springdoc.api-docs.path=/v3/api-docs
# clickable Swagger page
springdoc.swagger-ui.path=/swagger-ui.html

# where MySQL lives (makes employee_db if it is missing)
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# MySQL login name
spring.datasource.username=root
# MySQL login password
spring.datasource.password=root
# how Java talks to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create or update the employees table to match the Employee class
spring.jpa.hibernate.ddl-auto=update
# print database commands in the console
spring.jpa.show-sql=true
# tell Hibernate we are using MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- logging levels (what shows in the console) ---
# default for everything: INFO = normal messages, DEBUG = more detail, TRACE = everything
logging.level.root=INFO
# our app code (controller, service, repository): DEBUG helps while testing APIs
logging.level.com.emp.employeeopenapidoc=DEBUG
# Spring web layer: DEBUG shows which URL was called and the HTTP method
logging.level.org.springframework.web=DEBUG
# SQL text from Hibernate (works with spring.jpa.show-sql above)
logging.level.org.hibernate.SQL=DEBUG
# actual values sent into SQL (? placeholders) — TRACE is very detailed
logging.level.org.hibernate.orm.jdbc.bind=TRACE
