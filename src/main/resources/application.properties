# name shown in logs
spring.application.name=employeeopenapidoc
# HTTP port
server.port=8080

# generated OpenAPI JSON
springdoc.api-docs.path=/v3/api-docs
# Swagger UI page
springdoc.swagger-ui.path=/swagger-ui.html

# MySQL URL (creates employee_db if missing)
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# MySQL user
spring.datasource.username=root
# MySQL password
spring.datasource.password=root
# MySQL driver class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create/update tables from Employee class
spring.jpa.hibernate.ddl-auto=update
# print SQL in console
spring.jpa.show-sql=true
# MySQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
